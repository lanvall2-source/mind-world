name: Build Toss AIT Bundle

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        env:
          VITE_TOSS_APP: "true"
        run: |
          npm run build
          ls -la dist/

      - name: Build Official Toss AIT Bundle
        run: |
          npm install --no-save @apps-in-toss/cli @apps-in-toss/ait-format @apps-in-toss/ait-format-proto uuidv7
          echo "Packaging mind-world.ait..."
          node scripts/pack-toss-ait.mjs
          ls -lh mind-world.ait

      - name: Upload AIT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mind-world-ait
          path: mind-world.ait
          if-no-files-found: error

      - name: Publish Toss Bundle Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-toss
          name: "마음이 자라는 세계 토스 미니앱 번들 (mind-world.ait)"
          body: "토스 앱인토스(AIT) 공식 번들 규격이 적용된 마음이 자라는 세계 미니앱 번들 파일입니다."
          files: mind-world.ait
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
